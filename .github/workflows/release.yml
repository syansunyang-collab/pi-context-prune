name: Release to npm

# Publishes the package to npm whenever a semver tag like v1.0.0 is pushed.
# Uses npm trusted publishing via GitHub Actions OIDC; no NPM_TOKEN secret is required.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # enables npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag version:     $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build
        run: npm run build --if-present

      # Trusted publishing: npm exchanges the GitHub OIDC token for a short-lived credential and
      # attaches provenance by itself. Passing --provenance or an explicit --access makes it take
      # the token path instead, which has no token here and fails with a 404 on PUT.
      - name: Publish to npm with trusted publishing
        # registry-url is deliberately not set on setup-node: it writes an .npmrc with
        # _authToken=${NODE_AUTH_TOKEN}, and that placeholder credential makes npm publish as an
        # anonymous user (404 on PUT) instead of exchanging the GitHub OIDC token.
        run: |
          npm -v
          npm publish
